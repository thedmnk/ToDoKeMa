const XP_LEVELS = [
  0,100,250,500,850,1300,1900,2700,3700,5000,

];
function getLevel(xp) {
  let lvl=1;
  for(let i=0;i<XP_LEVELS.length;i++) if(xp>=XP_LEVELS[i]) lvl=i+1;
  return Math.min(lvl,20);
}
function xpForNext(xp) {
  const lvl=getLevel(xp);
  return lvl>=20?XP_LEVELS[19]:XP_LEVELS[lvl];
}
function xpProgress(xp) {
  const lvl=getLevel(xp); const prev=XP_LEVELS[lvl-1]||0; const next=xpForNext(xp);
  return next>prev?(xp-prev)/(next-prev)*100:100;
}

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ── ADAPTIVE MATCHING ────────────────────────────────────────────────────────
function generateAdaptivePairs(tasks) {
  const active = tasks.filter(t => !t.done);
  if (active.length < 2) return [];
  const sorted = [...active].sort((a,b) => b.score - a.score);
  const tierSize = Math.max(3, Math.ceil(sorted.length / 6));
  const tiers = [];
  for (let i = 0; i < sorted.length; i += tierSize) tiers.push(sorted.slice(i, i+tierSize));

  const pairs = [], added = new Set();
  const key = (a,b) => a < b ? `${a}-${b}` : `${b}-${a}`;

  for (const tier of tiers) {
    const tp = [];
    for (let i = 0; i < tier.length; i++)
      for (let j = i+1; j < tier.length; j++) {
        const k = key(tier[i].id, tier[j].id);
        if (!added.has(k)) { tp.push([tier[i].id, tier[j].id]); added.add(k); }
      }
    pairs.push(...shuffle(tp));
  }
  for (let t = 0; t < tiers.length-1; t++) {
    const cp = [];
    for (const a of tiers[t]) for (const b of tiers[t+1]) {
      const k = key(a.id, b.id);
      if (!added.has(k)) { cp.push([a.id, b.id]); added.add(k); }
    }
    pairs.push(...shuffle(cp));
  }
  const rem = [];
  for (let i = 0; i < active.length; i++)
    for (let j = i+1; j < active.length; j++) {
      const k = key(active[i].id, active[j].id);
      if (!added.has(k)) { rem.push([active[i].id, active[j].id]); added.add(k); }
    }
  pairs.push(...shuffle(rem));
  return pairs;
}

// ── FIREBASE SYNC ────────────────────────────────────────────────────────────
async function waitForFirebase(timeout=5000) {
  if (window._firebase) return window._firebase;
  return new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error("Firebase timeout")), timeout);
    window.addEventListener("firebase-ready", () => { clearTimeout(t); res(window._firebase); }, {once:true});
  });
}

async function persist(data) {
  // Always save locally first (fallback)
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
  try { await window.storage?.set(STORAGE_KEY, JSON.stringify(data)); } catch {}
  // Save to Firebase
  try {
    const fb = await waitForFirebase();
    const { db, doc, setDoc } = fb;
    await setDoc(doc(db, "appstate", "global"), { data: JSON.stringify(data), updated: Date.now() });
  } catch(e) { console.warn("Firebase save failed, using local:", e.message); }
}

async function hydrate() {
  // Try Firebase first
  try {
    const fb = await waitForFirebase(3000);
    const { db, doc, getDoc } = fb;
    const snap = await getDoc(doc(db, "appstate", "global"));
    if (snap.exists()) {
      const parsed = JSON.parse(snap.data().data);
      // Also update local cache
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed)); } catch {}
      return parsed;
    }
  } catch(e) { console.warn("Firebase load failed, using local:", e.message); }
  // Fallback to local
  try { const r = await window.storage?.get(STORAGE_KEY); if(r?.value) return JSON.parse(r.value); } catch {}
  try { const r = localStorage.getItem(STORAGE_KEY); if(r) return JSON.parse(r); } catch {}
  return null;
}

// Real-time listener - updates app when another device saves
function subscribeToChanges(callback) {
  try {
    waitForFirebase().then(fb => {
      const { db, doc, onSnapshot } = fb;
      return onSnapshot(doc(db, "appstate", "global"), (snap) => {
        if (snap.exists()) {
          try {
            const parsed = JSON.parse(snap.data().data);
            callback(parsed);
          } catch {}
        }
      });
    });
  } catch(e) { console.warn("Firebase listener failed:", e); }
}
function simpleHash(s) { let h=0; for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;} return h.toString(36); }

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{borderRadius:r,overflow:"hidden",flexShrink:0}}>

      <rect x="0"  y={h}  width={h} height={h} fill={TDKM.K}/>
      <rect x={h}  y={h}  width={h} height={h} fill={TDKM.M}/>
      <rect x={h-0.5} y="0" width="1" height={size} fill="rgba(0,0,0,0.25)"/>
      <rect x="0" y={h-0.5} width={size} height="1" fill="rgba(0,0,0,0.25)"/>
      {[["T",h/2,h/2],["D",h+h/2,h/2],["K",h/2,h+h/2],["M",h+h/2,h+h/2]].map(([l,x,y])=>(
        <text key={l} x={x} y={y} textAnchor="middle" dominantBaseline="central"
          fontSize={fs} fontWeight="bold" fontFamily="system-ui,sans-serif" fill="rgba(255,255,255,0.93)">{l}</text>
      ))}

}

function App() {
  const [lang, setLang] = useState("de");
  const [appState, setAppState] = useState(null);
  const [currentUser, setCurrentUser] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [authMode, setAuthMode] = useState("login");
  const [authName, setAuthName] = useState("");
  const [authPass, setAuthPass] = useState("");
  const [authError, setAuthError] = useState("");
  const t = T[lang];

  useEffect(() => {
    (async () => {
      const saved = await hydrate();
      if (saved) { setAppState(saved); setLang(saved.lang||"de"); }
      else setAppState({ users:[], lang:"de", version:APP_VERSION });
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded||!appState) return;
    persist({ ...appState, lang });
  }, [appState, lang, loaded]);

  // Real-time sync from other devices
  useEffect(() => {
    if (!loaded) return;
    subscribeToChanges((remoteState) => {
      // Only update if remote is newer and we are not the one who just saved
      if (remoteState && remoteState.users) {
        setAppState(prev => {
          // Merge: keep local user's current session, update other users
          if (!prev) return remoteState;
          return { ...remoteState, lang: prev.lang };
        });
      }
    });
  }, [loaded]);

  const handleLogin = () => {
    const user = appState.users.find(u=>u.name.toLowerCase()===authName.trim().toLowerCase());
    if (!user) { setAuthError(t.noAccount); return; }
    if (user.passHash!==simpleHash(authPass)) { setAuthError(t.wrongPassword); return; }
    setCurrentUser(user.name); setAuthError("");
  };
  const [selectedClass, setSelectedClass] = useState("knight");

  const handleRegister = () => {
    const name = authName.trim();
    if (!name||!authPass) return;
    if (appState.users.find(u=>u.name.toLowerCase()===name.toLowerCase())) { setAuthError(t.userExists); return; }
    const tasks = DEFAULT_TASKS.map((d,i)=>makeTask(d,i));
    const newUser = { name, passHash:simpleHash(authPass), tasks, pairs:generateAdaptivePairs(tasks), currentIndex:0, categories:[...CATS_DEFAULT], projects:[], heroClass:selectedClass, xp:0, clanXp:0, achievements:[] };
    setAppState(prev=>({ ...prev, users:[...(prev.users||[]), newUser] }));
    setCurrentUser(name); setAuthError("");
  };

  const updateUser = fn => setAppState(prev=>({ ...prev, users:prev.users.map(u=>u.name===currentUser?fn(u):u) }));
  const getUser = () => appState?.users?.find(u=>u.name===currentUser);

  if (!loaded) return <div style={S.root}><span style={{color:"#334155"}}>…</span></div>;

  if (!currentUser) return (
    <div style={S.root}>
      <div style={S.authCard}>
        <div style={S.authTop}><TDKMLogo size={64}/><div><div style={S.authLogo}>{t.appName}</div><div style={S.authSub}>To · Do · Ke · Ma</div></div></div>
        <div style={S.authField}><label style={S.label}>{t.name}</label>
          <input style={S.input} value={authName} onChange={e=>setAuthName(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&(authMode==="login"?handleLogin():handleRegister())} placeholder="z.B. Dom" autoFocus/></div>
        <div style={S.authField}><label style={S.label}>{t.password}</label>
          <input style={S.input} type="password" value={authPass} onChange={e=>setAuthPass(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&(authMode==="login"?handleLogin():handleRegister())} placeholder="••••••"/></div>
        {authError&&<p style={S.authError}>{authError}</p>}
        {authMode==="login"
          ?<><button style={S.primaryBtn} onClick={handleLogin}>{t.login}</button>
             <p style={S.authSwitch}>{t.noAccount} <span style={S.authLink} onClick={()=>{setAuthMode("register");setAuthError("");}}>{t.register}</span></p></>
          :<>
            <div style={{marginBottom:14}}>
              <label style={S.label}>{lang==="de"?"Deine Klasse wählen":"Choose your class"}</label>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:6}}>
                {CLASSES.map(cls=>(
                  <button key={cls.id} style={{padding:"10px 8px",background:selectedClass===cls.id?"rgba(99,102,241,0.25)":"rgba(255,255,255,0.04)",border:`1.5px solid ${selectedClass===cls.id?"#6366f1":"rgba(255,255,255,0.1)"}`,borderRadius:10,color:selectedClass===cls.id?"#e2e8f0":"#64748b",cursor:"pointer",textAlign:"center"}}
                    onClick={()=>setSelectedClass(cls.id)}>
                    <div style={{fontSize:22}}>{cls.icon}</div>
                    <div style={{fontSize:12,marginTop:3}}>{cls.name[lang]}</div>
                  </button>
                ))}
              </div>
            </div>
            <button style={S.primaryBtn} onClick={handleRegister}>{t.register}</button>
            <p style={S.authSwitch}>{t.alreadyAccount} <span style={S.authLink} onClick={()=>{setAuthMode("login");setAuthError("");}}>{t.login}</span></p>
          </>}
        <button style={S.langToggle} onClick={()=>setLang(l=>l==="de"?"en":"de")}>{t.lang}</button>
      </div>
    </div>
  );

  const user = getUser();
  if (!user) { setCurrentUser(null); return null; }
  return <UserApp user={user} updateUser={updateUser} lang={lang} setLang={setLang} t={t} onLogout={()=>setCurrentUser(null)}/>;
}

// ── USER APP ─────────────────────────────────────────────────────────────────
function UserApp({ user, updateUser, lang, setLang, t, onLogout }) {
  const [view, setView] = useState("compare");
  const [chosen, setChosen] = useState(null);
  const [animating, setAnimating] = useState(false);
  const [exportCode, setExportCode] = useState("");
  const [importCode, setImportCode] = useState("");
  const [exportDone, setExportDone] = useState(false);
  const [importError, setImportError] = useState("");
  const [filterCat, setFilterCat] = useState("all");
  const [tlSort, setTlSort] = useState("date");
  const [expanded, setExpanded] = useState(null);
  const [newTask, setNewTask] = useState({text:"",category:"Allgemein",effort:"medium",important:false,urgent:false});
  const [newSubtask, setNewSubtask] = useState({});
  const [newProject, setNewProject] = useState("");
  const [newCat, setNewCat] = useState("");
  const [assessingTask, setAssessingTask] = useState(null);
  const [selectedDot, setSelectedDot] = useState(null);
  const [victory, setVictory] = useState(null); // {monster, xp, task}
  const inputRef = useRef(null);

  const tasks = user.tasks||[];
  const active = tasks.filter(t=>!t.done);
  const done_tasks = tasks.filter(t=>t.done);
  const pairs = user.pairs||generateAdaptivePairs(active);
  const ci = user.currentIndex||0;
  const total = pairs.length;
  const allDone = ci>=total;
  const progress = Math.min((ci/Math.max(total,1))*100,100);
  const sorted = [...active].sort((a,b)=>b.score-a.score);
  const maxScore = Math.max(sorted[0]?.score??1,1);
  const getTask = id=>tasks.find(t=>t.id===id);
  // Tasks that have never been assessed (assessed flag not set)
  const unassessed = active.filter(t=>t.assessed===undefined||t.assessed===false);
  const rankEmoji = i=>["🥇","🥈","🥉"][i]??`${i+1}.`;
  const eIcon = e=>EFFORT_LABELS[e]?.icon??"·";
  const eLabel = e=>EFFORT_LABELS[e]?.[lang]??e;

  const toggleDone = id => {
    updateUser(u=>{
      const task=u.tasks.find(t=>t.id===id); const nd=!task.done;
      const updated=u.tasks.map(t=>t.id===id?{...t,done:nd,doneAt:nd?new Date().toISOString():null}:t);
      if (nd) {
        const monster=getMonster(task);
        let xpGain=monster.xp;
        // Class bonus
        const cls=CLASSES.find(c=>c.id===u.heroClass);
        if(cls?.bonus==="urgent"&&task.urgent) xpGain=Math.round(xpGain*1.3);
        if(cls?.bonus==="important"&&task.important) xpGain=Math.round(xpGain*1.3);
        if(cls?.bonus==="small"&&task.effort==="small") xpGain=Math.round(xpGain*1.5);
        const newXp=(u.xp||0)+xpGain;
        // Check achievements
        const newAch=[...(u.achievements||[])];
        ACHIEVEMENTS.forEach(a=>{if(!newAch.includes(a.id)&&a.check({...u,xp:newXp,tasks:updated},updated))newAch.push(a.id);});
        setTimeout(()=>{setVictory({monster,xp:xpGain,taskName:task.text});setTimeout(()=>setVictory(null),2800);},100);
        return {...u,tasks:updated,pairs:generateAdaptivePairs(updated),currentIndex:0,xp:newXp,clanXp:(u.clanXp||0)+xpGain,achievements:newAch};
      }
      return {...u,tasks:updated,pairs:generateAdaptivePairs(updated),currentIndex:0};
    });
  };

  const choose = winnerId => {
    if(animating) return;
    setChosen(winnerId); setAnimating(true);
    setTimeout(()=>{
      updateUser(u=>{
        const updated=u.tasks.map(t=>t.id===winnerId?{...t,score:t.score+1}:t);
        return {...u,tasks:updated,pairs:generateAdaptivePairs(updated),currentIndex:(u.currentIndex||0)+1};
      });
      setChosen(null); setAnimating(false);
    },300);
  };

  const skip = () => { if(!animating) updateUser(u=>({...u,currentIndex:(u.currentIndex||0)+1})); };

  const restart = () => {
    updateUser(u=>{const r=u.tasks.map(t=>({...t,score:0}));return{...u,tasks:r,pairs:generateAdaptivePairs(r.filter(t=>!t.done)),currentIndex:0};});
    setView("compare");
  };

  const handlePhotoScan = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setScanning(true); setScanError(""); setScannedTasks([]);

    try {
      // Convert image to base64
      const base64 = await new Promise((res, rej) => {
        const reader = new FileReader();
        reader.onload = () => res(reader.result.split(",")[1]);
        reader.onerror = rej;
        reader.readAsDataURL(file);
      });

      // Call Claude API to extract tasks from image
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          messages: [{
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: file.type, data: base64 } },
              { type: "text", text: "Extract all tasks/to-do items from this image. Return ONLY a JSON array of strings, one per task. Example: ["Task 1", "Task 2"]. No explanation, no markdown, just the JSON array." }
            ]
          }]
        })
      });

      const data = await response.json();
      const text = data.content?.[0]?.text || "[]";
      const clean = text.replace(/```json|```/g,"").trim();
      const found = JSON.parse(clean);
      if (Array.isArray(found) && found.length > 0) {
        setScannedTasks(found.map(t => ({ text: t, selected: true })));
      } else {
        setScanError(t.scanEmpty);
      }
    } catch (err) {
      setScanError(lang==="de" ? "Fehler beim Lesen" : "Error reading image");
    }
    setScanning(false);
    if (photoRef.current) photoRef.current.value = "";
  };

  const addScannedTasks = () => {
    const toAdd = scannedTasks.filter(t => t.selected).map((st, i) =>
      ({...makeTask({text:st.text, category:"Allgemein", effort:"medium", important:false, urgent:false}, i), assessed:false})
    );
    if (toAdd.length === 0) return;
    updateUser(u => {
      const upd = [...u.tasks, ...toAdd];
      return {...u, tasks:upd, pairs:generateAdaptivePairs(upd.filter(t=>!t.done)), currentIndex:0};
    });
    setScannedTasks([]);
  };

  const addTask = () => {
    if(!newTask.text.trim()) return;
    const t={...makeTask(newTask,Date.now()), assessed:false};
    updateUser(u=>{const upd=[...u.tasks,t];return{...u,tasks:upd,pairs:generateAdaptivePairs(upd.filter(t=>!t.done)),currentIndex:0};});
    setNewTask({text:"",category:newTask.category,effort:"medium",important:false,urgent:false});
    setAssessingTask(t);
    setView("assess");
  };

  const deleteTask = id => updateUser(u=>{
    const upd=u.tasks.filter(t=>t.id!==id);
    return{...u,tasks:upd,pairs:generateAdaptivePairs(upd.filter(t=>!t.done)),currentIndex:0};
  });

  const updateTask = (id,ch) => updateUser(u=>({...u,tasks:u.tasks.map(t=>t.id===id?{...t,...ch}:t)}));

  const addSubtask = taskId => {
    const text=(newSubtask[taskId]||"").trim(); if(!text) return;
    updateUser(u=>({...u,tasks:u.tasks.map(t=>t.id===taskId?{...t,subtasks:[...(t.subtasks||[]),{id:Date.now(),text,done:false}]}:t)}));
    setNewSubtask(p=>({...p,[taskId]:""}));
  };
  const toggleSub = (tid,sid) => updateUser(u=>({...u,tasks:u.tasks.map(t=>t.id===tid?{...t,subtasks:t.subtasks.map(s=>s.id===sid?{...s,done:!s.done}:s)}:t)}));

  const addProject = () => {
    if(!newProject.trim()) return;
    updateUser(u=>({...u,projects:[...(u.projects||[]),{id:Date.now(),name:newProject.trim()}]}));
    setNewProject("");
  };
  const addCat = () => {
    if(!newCat.trim()||user.categories.includes(newCat.trim())) return;
    updateUser(u=>({...u,categories:[...u.categories,newCat.trim()]}));
    setNewCat("");
  };

  const doExport = () => {
    const code=btoa(JSON.stringify({version:APP_VERSION,exported:new Date().toISOString(),tasks:user.tasks,categories:user.categories,projects:user.projects}));
    setExportCode(code);
    try{navigator.clipboard.writeText(code);setExportDone(true);setTimeout(()=>setExportDone(false),2000);}catch{}
  };
  const doImport = () => {
    try{
      const d=JSON.parse(atob(importCode.trim()));
      if(!d.tasks) throw new Error();
      updateUser(u=>({...u,tasks:d.tasks,categories:d.categories||u.categories,projects:d.projects||u.projects,pairs:generateAdaptivePairs(d.tasks),currentIndex:0}));
      setImportCode(""); setImportError("");
    }catch{setImportError("Ungültiger Code / Invalid code");}
  };

  const eis = {
    q1:active.filter(t=>t.important&&t.urgent), q2:active.filter(t=>t.important&&!t.urgent),
    q3:active.filter(t=>!t.important&&t.urgent), q4:active.filter(t=>!t.important&&!t.urgent),
  };

  const tlTasks=[...done_tasks].sort((a,b)=>new Date(b.doneAt||0)-new Date(a.doneAt||0));
  const gByDate={}, gByCat={};
  tlTasks.forEach(task=>{
    const d=task.doneAt?new Date(task.doneAt).toLocaleDateString(lang==="de"?"de-DE":"en-GB",{day:"2-digit",month:"long",year:"numeric"}):"—";
    if(!gByDate[d])gByDate[d]=[];gByDate[d].push(task);
    if(!gByCat[task.category])gByCat[task.category]=[];gByCat[task.category].push(task);
  });

  const DoneBtn = ({task,lg}) => (
    <button style={{...S.doneBtn,...(task.done?S.doneBtnOn:{}),...(lg?S.doneBtnLg:{})}}
      onClick={e=>{e.stopPropagation();toggleDone(task.id);}}>
      {task.done?"✓":"○"}
    </button>
  );

  const Chips = ({task, showMonster=false}) => {
    const monster = getMonster(task);
    return (
      <div style={S.chips}>
        {showMonster&&<span style={{fontSize:16,filter:task.done?"grayscale(1)":"none"}} title={monster.name[lang]}>{monster.emoji}</span>}
        <span style={S.catChip}>{task.category}</span>
        <span style={S.effortChip}>{eIcon(task.effort)} {eLabel(task.effort)}</span>
        {task.important&&<span style={S.starChip}>★</span>}
        {task.urgent&&<span style={S.urgChip}>!</span>}
        {task.subtasks?.length>0&&<span style={S.subChip}>↳{task.subtasks.filter(s=>s.done).length}/{task.subtasks.length}</span>}
      </div>
    );
  };

  const heroClass = CLASSES.find(cl=>cl.id===user.heroClass)||CLASSES[0];
  const userXp = user.xp||0;
  const userLevel = getLevel(userXp);
  const xpPct = xpProgress(userXp);

  const Nav = () => (
    <div style={S.nav}>
      {[{id:"compare",icon:"⚖️"},{id:"matrix",icon:"🔲"},{id:"ranking",icon:"🏆"},{id:"rpg",icon:"⚔️"},{id:"timeline",icon:"✅"},{id:"manage",icon:"⚙️"}].map(({id,icon})=>(
        <button key={id} style={{...S.navBtn,...(view===id?S.navActive:{})}} onClick={()=>setView(id)}>
          <span style={S.navIcon}>{icon}</span>
          <span style={{...S.navLabel,...(view===id?{color:"#a78bfa"}:{})}}>{t[id]||id}</span>
        </button>
      ))}
    </div>
  );

  // Victory overlay
  const VictoryOverlay = () => victory ? (
    <div style={S.victoryOverlay}>
      <div style={S.victoryCard}>
        <div style={{fontSize:56,marginBottom:4}}>{victory.monster.emoji}</div>
        <div style={{fontSize:13,color:"#ef4444",fontFamily:"monospace",marginBottom:2}}>{victory.monster.name[lang]} {lang==="de"?"besiegt!":"defeated!"}</div>
        <div style={{fontSize:22,fontWeight:800,color:"#fbbf24"}}>+{victory.xp} XP ⚔️</div>
        <div style={{fontSize:11,color:"#475569",marginTop:4,maxWidth:160,textAlign:"center",lineHeight:1.3}}>{victory.taskName}</div>
      </div>
    </div>
  ) : null;

  // XP Banner in Header
  const XPBanner = () => (
    <div style={S.xpBanner}>
      <span style={{fontSize:14}}>{heroClass.icon}</span>
      <div style={{flex:1}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
          <span style={{fontSize:10,color:"#a78bfa",fontFamily:"monospace"}}>Lvl {userLevel} {heroClass.name[lang]}</span>
          <span style={{fontSize:10,color:"#475569",fontFamily:"monospace"}}>{userXp} XP</span>
        </div>
        <div style={S.xpTrack}><div style={{...S.xpFill,width:`${xpPct}%`}}/></div>
      </div>
    </div>
  );

  const Header = ({title}) => (
    <div>
      <div style={S.header}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <TDKMLogo size={36}/>
          <div>
            <div style={S.hTitle}>{title}</div>
            <div style={S.hSub}>{user.name} · {active.length} aktiv · {done_tasks.length} ✓ · v{APP_VERSION}</div>
          </div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button style={S.iconBtn} onClick={()=>setLang(l=>l==="de"?"en":"de")}>{t.lang}</button>
          <button style={S.iconBtn} onClick={onLogout}>↩</button>
        </div>
      </div>
      <XPBanner/>
      <VictoryOverlay/>
    </div>
  );

  // ── ASSESS SCREEN ────────────────────────────────────────────────────────
  // Also show if there are unassessed tasks and user opens compare
  const assessTarget = assessingTask || (view==="compare" && unassessed.length>0 ? unassessed[0] : null);

  const AssessScreen = ({task}) => {
    const [dragPos, setDragPos] = useState({x:0,y:0});
    const [dragging, setDragging] = useState(false);
    const [landed, setLanded] = useState(null);
    const [startPos, setStartPos] = useState({x:0,y:0});
    const matrixRef = useRef(null);

    const getQuadrant = (x,y,rect) => {
      const mx=x-rect.left, my=y-rect.top;
      const imp=my<rect.height/2, urg=mx>rect.width/2;
      return {important:imp,urgent:urg};
    };

    const onTouchStart = e => {
      const t=e.touches[0];
      setStartPos({x:t.clientX,y:t.clientY});
      setDragPos({x:0,y:0});
      setDragging(true); setLanded(null);
    };
    const onTouchMove = e => {
      if(!dragging) return;
      const t=e.touches[0];
      setDragPos({x:t.clientX-startPos.x, y:t.clientY-startPos.y});
      if(matrixRef.current){
        const rect=matrixRef.current.getBoundingClientRect();
        if(t.clientX>=rect.left&&t.clientX<=rect.right&&t.clientY>=rect.top&&t.clientY<=rect.bottom){
          setLanded(getQuadrant(t.clientX,t.clientY,rect));
        } else { setLanded(null); }
      }
    };
    const onTouchEnd = () => {
      setDragging(false);
      setDragPos({x:0,y:0});
      if(landed){
        updateUser(u=>({...u,tasks:u.tasks.map(tk=>tk.id===task.id?{...tk,important:landed.important,urgent:landed.urgent,assessed:true}:tk)}));
        const next=unassessed.find(tk=>tk.id!==task.id);
        if(next){setAssessingTask(next);}
        else{setAssessingTask(null);setView("compare");}
      }
    };

    const doSkip = () => {
      updateUser(u=>({...u,tasks:u.tasks.map(tk=>tk.id===task.id?{...tk,assessed:true}:tk)}));
      const next=unassessed.find(tk=>tk.id!==task.id);
      if(next){setAssessingTask(next);}
      else{setAssessingTask(null);setView("compare");}
    };

    const quadrants=[
      {imp:true,urg:false,label:t.q2,sub:t.importantNotUrgent,icon:"📅",color:"#6366f1"},
      {imp:true,urg:true,label:t.q1,sub:t.importantUrgent,icon:"🔥",color:"#ef4444"},
      {imp:false,urg:false,label:t.q4,sub:t.notImportantNotUrgent,icon:"🗑️",color:"#64748b"},
      {imp:false,urg:true,label:t.q3,sub:t.notImportantUrgent,icon:"👥",color:"#f59e0b"},
    ];

    const isLanded=(imp,urg)=>landed&&landed.important===imp&&landed.urgent===urg;

    return (
      <div style={S.root}><div style={S.card}>
        <div style={S.header}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <TDKMLogo size={36}/>
            <div><div style={S.hTitle}>{t.assessTitle}</div>
              <div style={S.hSub}>{unassessed.length} {lang==="de"?"noch einzuschätzen":"to assess"}</div></div>
          </div>
          <button style={S.iconBtn} onClick={doSkip}>{t.assessSkip}</button>
        </div>

        <p style={{...S.question,marginBottom:8}}>{t.assessSub}</p>

        {/* Task card to drag */}
        <div style={{padding:"0 16px",marginBottom:16}}>
          <div
            onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
            style={{...S.assessCard, transform:`translate(${dragPos.x}px,${dragPos.y}px)`, opacity:dragging?0.85:1, zIndex:dragging?50:1, boxShadow:dragging?"0 16px 40px rgba(0,0,0,0.5)":"0 4px 16px rgba(0,0,0,0.3)", cursor:"grab" }}>
            <div style={{fontSize:14,color:"#e2e8f0",lineHeight:1.4,marginBottom:6}}>{task.text}</div>
            <Chips task={task}/>
            <div style={{fontSize:11,color:"#475569",marginTop:8,fontFamily:"monospace"}}>☝️ {lang==="de"?"Gedrückt halten + ziehen":"Hold & drag"}</div>
          </div>
        </div>

        {/* 2x2 Matrix drop zones */}
        <div style={{padding:"0 16px"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
            <span style={{fontSize:10,color:"#334155",fontFamily:"monospace"}}>← {lang==="de"?"Nicht dringend":"Not urgent"}</span>
            <span style={{fontSize:10,color:"#334155",fontFamily:"monospace"}}>{lang==="de"?"Dringend":"Urgent"} →</span>
          </div>
          <div ref={matrixRef} style={S.assessMatrix}>
            {quadrants.map(({imp,urg,label,sub,icon,color})=>(
              <div key={`${imp}-${urg}`} style={{...S.assessQuad,
                borderColor:isLanded(imp,urg)?color+"cc":color+"33",
                background:isLanded(imp,urg)?color+"22":color+"0a",
                transform:isLanded(imp,urg)?"scale(1.03)":"scale(1)"}}>
                <span style={{fontSize:20}}>{icon}</span>
                <div style={{fontSize:11,fontWeight:700,color:isLanded(imp,urg)?color:"#64748b"}}>{label}</div>
                <div style={{fontSize:9,color:"#334155",textAlign:"center",lineHeight:1.3}}>{sub}</div>
              </div>
            ))}
          </div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:4}}>
            <span style={{fontSize:10,color:"#334155",fontFamily:"monospace",writingMode:"horizontal-tb"}}>↑ {lang==="de"?"Wichtig":"Important"}</span>
            <span style={{fontSize:10,color:"#334155",fontFamily:"monospace"}}>↓ {lang==="de"?"Unwichtig":"Not important"}</span>
          </div>
        </div>

        {landed&&(
          <div style={{padding:"16px 16px 0",textAlign:"center"}}>
            <button style={S.primaryBtn} onClick={onTouchEnd}>{t.assessDone} {landed.important?"★":""}{landed.urgent?"!":""}</button>
          </div>
        )}
        <div style={{padding:"12px 16px 0"}}>
          <button style={S.skipBtn} onClick={doSkip}>{t.assessSkip}</button>
        </div>
      </div></div>
    );
  };

  if (view==="assess"&&assessTarget) return <AssessScreen task={assessTarget}/>;
  if (view==="compare"&&unassessed.length>0&&!assessingTask) {
    // Auto-show assess screen for first unassessed task
  }

  // ── COMPARE ───────────────────────────────────────────────────────────────
  if (view==="compare") {
    const pair=pairs[ci];
    const tA=pair?getTask(pair[0]):null, tB=pair?getTask(pair[1]):null;
    const valid=tA&&tB&&!tA.done&&!tB.done;
    const diff=tA&&tB?Math.abs(tA.score-tB.score):0;
    const badge=diff===0?t.matchEqual:diff<=2?t.matchClose:diff<=5?t.matchFar:t.matchCross;
    return (
      <div style={S.root}><div style={S.card}>
        <Header title={t.compare}/>
        <div style={S.progRow}><div style={S.progTrack}><div style={{...S.progFill,width:`${progress}%`}}/></div><span style={S.progLabel}>{ci}/{total}</span></div>
        {valid&&<div style={S.matchBadge}>{badge}</div>}
        {allDone||!valid?(
          <div style={S.doneBox}><div style={{fontSize:52,marginBottom:12}}>🎉</div><p style={S.doneText}>{t.allDone}</p>
            <button style={S.primaryBtn} onClick={()=>setView("ranking")}>{t.showRanking}</button>
            <button style={{...S.secondaryBtn,marginTop:10}} onClick={restart}>{t.restart}</button></div>
        ):(
          <>
            <p style={S.question}><em>{t.whatsMore}</em></p>
            <div style={S.duelWrap}>
              {[tA,tB].map(task=>(
                <div key={task.id} style={S.duelCol}>
                  <button style={{...S.taskBtn,...(chosen===task.id?S.taskBtnWin:{})}} onClick={()=>choose(task.id)} disabled={animating}>
                    <div style={{fontSize:36,marginBottom:4}}>{getMonster(task).emoji}</div>
                    <span style={S.taskBtnText}>{task.text}</span>
                    <Chips task={task}/>
                    <div style={{fontSize:10,color:getMonster(task).color,fontFamily:"monospace",marginTop:4}}>+{getMonster(task).xp} XP</div>
                  </button>
                  <div style={{display:"flex",justifyContent:"center",paddingTop:8}}>
                    <DoneBtn task={task} lg/>
                  </div>
                </div>
              ))}
            </div>
            <div style={{padding:"0 16px",marginTop:4}}><button style={S.skipBtn} onClick={skip}>{t.skip}</button></div>
          </>
        )}
        <Nav/>
      </div></div>
    );
  }

  // ── MATRIX ────────────────────────────────────────────────────────────────
  if (view==="matrix") {
    // X position: urgent=right, not urgent=left (with jitter to avoid overlap)
    // Y position: score-based (higher score = more important = higher up)
    const PLOT_W = 100, PLOT_H = 100;
    const scoreMax = Math.max(...active.map(t=>t.score), 1);

    const getDotPos = (task, idx) => {
      // X: urgent tasks on right half, not urgent on left half
      // Add slight jitter based on task id to spread overlapping dots
      const jitterX = ((task.id % 17) / 17 - 0.5) * 28;
      const jitterY = ((task.id % 13) / 13 - 0.5) * 18;
      const baseX = task.urgent ? 65 : 35;
      const x = Math.min(95, Math.max(5, baseX + jitterX));
      // Y: higher score = more important = lower Y value (top of SVG = important)
      const scorePct = scoreMax > 0 ? task.score / scoreMax : 0;
      const baseY = 85 - scorePct * 70; // 85=bottom(unimportant), 15=top(important)
      const y = Math.min(93, Math.max(7, baseY + jitterY));
      return {x, y};
    };

    const dotColor = task => {
      if (task.important && task.urgent) return "#ef4444";
      if (task.important && !task.urgent) return "#6366f1";
      if (!task.important && task.urgent) return "#f59e0b";
      return "#475569";
    };

    return (
      <div style={S.root}><div style={S.card}>
        <Header title={t.eisenhowerTitle}/>

        {/* Scatter plot */}
        <div style={{padding:"0 16px",position:"relative"}}>
          {/* Axis labels */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
            <span style={{fontSize:10,color:"#334155",fontFamily:"monospace"}}>← {lang==="de"?"Nicht dringend":"Not urgent"}</span>
            <span style={{fontSize:10,color:"#334155",fontFamily:"monospace"}}>{lang==="de"?"Dringend":"Urgent"} →</span>
          </div>

          <div style={{position:"relative",display:"flex",alignItems:"center",gap:6}}>
            {/* Y axis label */}
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,flexShrink:0}}>
              <span style={{fontSize:9,color:"#475569",fontFamily:"monospace",writingMode:"vertical-rl",transform:"rotate(180deg)",letterSpacing:"0.5px"}}>{lang==="de"?"WICHTIG ↑":"IMPORTANT ↑"}</span>
            </div>

            {/* SVG Plot */}
            <svg viewBox="0 0 100 100" style={{width:"100%",height:"auto",aspectRatio:"1/1",borderRadius:14,border:"1px solid rgba(255,255,255,0.08)",background:"rgba(255,255,255,0.02)",overflow:"visible"}}
              onClick={e=>{if(e.target===e.currentTarget)setSelectedDot(null);}}>

              {/* Quadrant background tints */}
              <rect x="0" y="0" width="50" height="50" fill="rgba(99,102,241,0.05)" rx="2"/>
              <rect x="50" y="0" width="50" height="50" fill="rgba(239,68,68,0.05)" rx="2"/>
              <rect x="0" y="50" width="50" height="50" fill="rgba(71,85,105,0.04)" rx="2"/>
              <rect x="50" y="50" width="50" height="50" fill="rgba(245,158,11,0.04)" rx="2"/>

              {/* Center cross lines */}
              <line x1="50" y1="0" x2="50" y2="100" stroke="rgba(255,255,255,0.08)" strokeWidth="0.5" strokeDasharray="2,2"/>
              <line x1="0" y1="50" x2="100" y2="50" stroke="rgba(255,255,255,0.08)" strokeWidth="0.5" strokeDasharray="2,2"/>

              {/* Task dots */}
              {active.map((task,idx)=>{
                const {x,y}=getDotPos(task,idx);
                const col=dotColor(task);
                const isSel=selectedDot?.id===task.id;
                return (
                  <g key={task.id} onClick={e=>{e.stopPropagation();setSelectedDot(isSel?null:task);}}>
                    {isSel&&<circle cx={x} cy={y} r="5" fill={col} opacity="0.25"/>}
                    <circle cx={x} cy={y} r={isSel?"3.5":"2.8"}
                      fill={col} stroke={isSel?"white":"rgba(255,255,255,0.3)"}
                      strokeWidth={isSel?"0.8":"0.4"}
                      style={{cursor:"pointer",transition:"all 0.2s"}}/>
                  </g>
                );
              })}
            </svg>
          </div>

          <div style={{display:"flex",justifyContent:"center",marginTop:4}}>
            <span style={{fontSize:9,color:"#334155",fontFamily:"monospace"}}>↓ {lang==="de"?"UNWICHTIG":"UNIMPORTANT"}</span>
          </div>

          {/* Legend */}
          <div style={{display:"flex",gap:12,justifyContent:"center",marginTop:10,flexWrap:"wrap"}}>
            {[["#6366f1",lang==="de"?"Wichtig":"Important"],["#ef4444",lang==="de"?"Wichtig + Dringend":"Important + Urgent"],["#f59e0b",lang==="de"?"Dringend":"Urgent"],["#475569",lang==="de"?"Weder noch":"Neither"]].map(([col,label])=>(
              <div key={label} style={{display:"flex",alignItems:"center",gap:5}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:col,flexShrink:0}}/>
                <span style={{fontSize:10,color:"#475569"}}>{label}</span>
              </div>
            ))}
          </div>
        </div>

        {/* Selected task card */}
        {selectedDot&&(
          <div style={{margin:"12px 16px 0",padding:"14px",background:"rgba(255,255,255,0.05)",border:`1px solid ${dotColor(selectedDot)}44`,borderRadius:14,animation:"none"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
              <div style={{flex:1}}>
                <div style={{fontSize:14,color:"#e2e8f0",lineHeight:1.4,marginBottom:6}}>{selectedDot.text}</div>
                <Chips task={selectedDot}/>
                <div style={{display:"flex",gap:12,marginTop:8}}>
                  <span style={{fontSize:11,color:"#475569",fontFamily:"monospace"}}>Score: {selectedDot.score}</span>
                  <span style={{fontSize:11,color:selectedDot.important?"#6366f1":"#334155",fontFamily:"monospace"}}>{selectedDot.important?"★ "+t.important:"○ "+t.important}</span>
                  <span style={{fontSize:11,color:selectedDot.urgent?"#ef4444":"#334155",fontFamily:"monospace"}}>{selectedDot.urgent?"! "+t.urgent:"○ "+t.urgent}</span>
                </div>
              </div>
              <DoneBtn task={selectedDot}/>
            </div>
          </div>
        )}

        <div style={{padding:"8px 16px 4px",textAlign:"center"}}>
          <span style={{fontSize:10,color:"#1e293b",fontFamily:"monospace"}}>{active.length} {lang==="de"?"Aufgaben":"tasks"} · {lang==="de"?"Antippen für Details":"Tap dot for details"}</span>
        </div>

        <Nav/>
      </div></div>
    );
  }

  // ── RPG TAB ──────────────────────────────────────────────────────────────
  if (view==="rpg") {
    const unlockedAch = (user.achievements||[]);
    const nextLevel = xpForNext(userXp);
    const prevLevel = XP_LEVELS[userLevel-1]||0;

    // Monster roster - count by type
    const monsterCounts = {};
    active.forEach(task => {
      const m = getMonster(task);
      const k = m.name[lang];
      if(!monsterCounts[k]) monsterCounts[k]={monster:m, count:0, defeated:0};
      monsterCounts[k].count++;
    });
    done_tasks.forEach(task => {
      const m = getMonster(task);
      const k = m.name[lang];
      if(!monsterCounts[k]) monsterCounts[k]={monster:m, count:0, defeated:0};
      monsterCounts[k].defeated++;
    });

    return (
      <div style={S.root}><div style={S.card}>
        <Header title={lang==="de"?"Heldenprofil":"Hero Profile"}/>

        {/* Hero card */}
        <div style={{padding:"0 16px 12px"}}>
          <div style={{background:"linear-gradient(135deg,rgba(99,102,241,0.15),rgba(124,58,237,0.1))",border:"1px solid rgba(99,102,241,0.3)",borderRadius:16,padding:"16px"}}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
              <div style={{fontSize:44}}>{heroClass.icon}</div>
              <div>
                <div style={{fontSize:18,fontWeight:700,color:"#f1f5f9"}}>{user.name}</div>
                <div style={{fontSize:13,color:"#818cf8"}}>{heroClass.name[lang]} · {lang==="de"?"Level":"Level"} {userLevel}</div>
                <div style={{fontSize:11,color:"#475569",fontFamily:"monospace"}}>{userXp} / {nextLevel} XP</div>
              </div>
            </div>
            <div style={S.xpTrackLg}><div style={{...S.xpFillLg,width:`${xpProgress(userXp)}%`}}/></div>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:4}}>
              <span style={{fontSize:9,color:"#334155",fontFamily:"monospace"}}>Lvl {userLevel}</span>
              <span style={{fontSize:9,color:"#334155",fontFamily:"monospace"}}>Lvl {Math.min(userLevel+1,20)}</span>
            </div>
          </div>
        </div>

        {/* Stats */}
        <div style={{padding:"0 16px 12px",display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
          {[
            {label:lang==="de"?"Besiegt":"Defeated", val:done_tasks.length, icon:"⚔️"},
            {label:lang==="de"?"Verbleibend":"Remaining", val:active.length, icon:"🐉"},
            {label:lang==="de"?"Clan XP":"Clan XP", val:user.clanXp||0, icon:"🏰"},
          ].map(({label,val,icon})=>(
            <div key={label} style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:12,padding:"10px 8px",textAlign:"center"}}>
              <div style={{fontSize:20,marginBottom:4}}>{icon}</div>
              <div style={{fontSize:18,fontWeight:700,color:"#f1f5f9"}}>{val}</div>
              <div style={{fontSize:10,color:"#475569"}}>{label}</div>
            </div>
          ))}
        </div>

        {/* Achievements */}
        <div style={{padding:"0 16px 12px"}}>
          <div style={S.secTitle}>{lang==="de"?"Errungenschaften":"Achievements"}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {ACHIEVEMENTS.map(a=>{
              const unlocked=unlockedAch.includes(a.id);
              return (
                <div key={a.id} style={{background:unlocked?"rgba(251,191,36,0.08)":"rgba(255,255,255,0.03)",border:`1px solid ${unlocked?"rgba(251,191,36,0.3)":"rgba(255,255,255,0.06)"}`,borderRadius:12,padding:"10px",opacity:unlocked?1:0.4}}>
                  <div style={{fontSize:22,marginBottom:4}}>{a.icon}</div>
                  <div style={{fontSize:12,fontWeight:600,color:unlocked?"#fbbf24":"#64748b",marginBottom:2}}>{a.name[lang]}</div>
                  <div style={{fontSize:10,color:"#475569",lineHeight:1.3}}>{a.desc[lang]}</div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Monster roster */}
        <div style={{padding:"0 16px 12px"}}>
          <div style={S.secTitle}>{lang==="de"?"Monsterbuch":"Bestiary"}</div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {Object.values(monsterCounts).sort((a,b)=>b.monster.xp-a.monster.xp).map(({monster,count,defeated})=>(
              <div key={monster.name[lang]} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:10}}>
                <span style={{fontSize:24}}>{monster.emoji}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,color:"#cbd5e1"}}>{monster.name[lang]}</div>
                  <div style={{fontSize:10,color:"#475569",fontFamily:"monospace"}}>{defeated} {lang==="de"?"besiegt":"defeated"} · {count} {lang==="de"?"übrig":"remaining"}</div>
                </div>
                <div style={{fontSize:12,color:monster.color,fontFamily:"monospace"}}>+{monster.xp} XP</div>
              </div>
            ))}
          </div>
        </div>

        <Nav/>
      </div></div>
    );
  }

  // ── RANKING ───────────────────────────────────────────────────────────────
  if (view==="ranking") {
    const fil=sorted.filter(t=>filterCat==="all"||t.category===filterCat);
    return (
      <div style={S.root}><div style={S.card}>
        <Header title={t.ranking}/>
        <div style={S.catFilter}>
          <button style={{...S.cfBtn,...(filterCat==="all"?S.cfActive:{})}} onClick={()=>setFilterCat("all")}>{t.filterCat}</button>
          {user.categories.map(c=><button key={c} style={{...S.cfBtn,...(filterCat===c?S.cfActive:{})}} onClick={()=>setFilterCat(c)}>{c}</button>)}
        </div>
        <div style={S.resList}>
          {fil.map((task,i)=>(
            <div key={task.id} style={{...S.resItem,background:i===0?"#f59e0b09":i<3?"#6366f109":"#ffffff04",borderColor:i===0?"#f59e0b33":i<3?"#6366f133":"#ffffff0e"}}>
              <span style={S.rankBadge}>{rankEmoji(i)}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                  <span style={{fontSize:18}}>{getMonster(task).emoji}</span>
                  <div style={S.resText}>{task.text}</div>
                </div>
                <Chips task={task}/>
              </div>
              <div style={S.scoreBar}><div style={{...S.scoreFill,width:`${(task.score/maxScore)*100}%`,background:i===0?"#f59e0b":i<3?"#818cf8":"#334155"}}/></div>
              <span style={S.scoreNum}>{task.score}</span>
              <DoneBtn task={task}/>
            </div>
          ))}
        </div>
        <Nav/>
      </div></div>
    );
  }

  // ── TIMELINE ──────────────────────────────────────────────────────────────
  if (view==="timeline") {
    const groups=tlSort==="date"?gByDate:gByCat;
    return (
      <div style={S.root}><div style={S.card}>
        <Header title={t.timelineTitle}/>
        <div style={{padding:"0 16px 12px",display:"flex",gap:8}}>
          <button style={{...S.sortBtn,...(tlSort==="date"?S.sortActive:{})}} onClick={()=>setTlSort("date")}>📅 {t.sortDate}</button>
          <button style={{...S.sortBtn,...(tlSort==="cat"?S.sortActive:{})}} onClick={()=>setTlSort("cat")}>🏷 {t.sortCat}</button>
        </div>
        {done_tasks.length===0?(
          <div style={S.emptyTl}><div style={{fontSize:52,marginBottom:14}}>🎯</div><p style={{color:"#334155",fontSize:15}}>{t.noTasksDone}</p></div>
        ):(
          <div style={{padding:"0 16px 8px"}}>
            {Object.keys(groups).map(key=>(
              <div key={key} style={{marginBottom:20}}>
                <div style={S.tlGroupHdr}>
                  <div style={S.tlLine}/><span style={S.tlGroupLabel}>{tlSort==="date"?`📅 ${key}`:`🏷 ${key}`}<span style={S.tlCount}>{groups[key].length}</span></span><div style={S.tlLine}/>
                </div>
                {groups[key].map(task=>(
                  <div key={task.id} style={S.tlItem}>
                    <div style={S.tlDot}/>
                    <div style={S.tlCard}>
                      <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
                        <div style={{flex:1}}>
                          <div style={S.tlText}>{task.text}</div>
                          <Chips task={task}/>
                          {tlSort!=="date"&&<div style={S.tlDate}>{task.doneAt?new Date(task.doneAt).toLocaleDateString(lang==="de"?"de-DE":"en-GB",{day:"2-digit",month:"short",year:"numeric"}):"—"}</div>}
                        </div>
                        <button style={S.undoneBtn} onClick={()=>toggleDone(task.id)}>{t.undone}</button>
                      </div>
                      {task.subtasks?.length>0&&(
                        <div style={S.subProg}><div style={S.subBar}><div style={{...S.subFill,width:`${(task.subtasks.filter(s=>s.done).length/task.subtasks.length)*100}%`}}/></div>
                          <span style={S.subCount}>{task.subtasks.filter(s=>s.done).length}/{task.subtasks.length}</span></div>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            ))}
          </div>
        )}
        <Nav/>
      </div></div>
    );
  }

  // ── MANAGE ────────────────────────────────────────────────────────────────
  if (view==="manage") return (
    <div style={S.root}><div style={S.card}>
      <Header title={t.manage}/>

      <div style={S.sec}>
        <div style={S.secTitle}>{t.addTask}</div>
        <input ref={inputRef} style={S.input} value={newTask.text} onChange={e=>setNewTask(p=>({...p,text:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addTask()} placeholder={t.newTask}/>
        <div style={S.row}>
          <select style={S.sel} value={newTask.category} onChange={e=>setNewTask(p=>({...p,category:e.target.value}))}>{user.categories.map(c=><option key={c}>{c}</option>)}</select>
          <select style={S.sel} value={newTask.effort} onChange={e=>setNewTask(p=>({...p,effort:e.target.value}))}>{Object.entries(EFFORT_LABELS).map(([k,v])=><option key={k} value={k}>{v.icon} {v[lang]}</option>)}</select>
        </div>
        <div style={S.row}>
          <label style={S.chk}><input type="checkbox" checked={newTask.important} onChange={e=>setNewTask(p=>({...p,important:e.target.checked}))}/><span>★ {t.important}</span></label>
          <label style={S.chk}><input type="checkbox" checked={newTask.urgent} onChange={e=>setNewTask(p=>({...p,urgent:e.target.checked}))}/><span>! {t.urgent}</span></label>
        </div>
        <button style={{...S.primaryBtn,marginTop:10}} onClick={addTask}>{t.addTask}</button>

      </div>

      <div style={S.sec}>
        <div style={S.secTitle}>{t.activeTasks} ({active.length})</div>
        <div style={S.manList}>
          {active.map((task,i)=>(
            <div key={task.id}>
              <div style={S.manItem} onClick={()=>setExpanded(expanded===task.id?null:task.id)}>
                <span style={S.manNum}>{i+1}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                    <span style={{fontSize:16}}>{getMonster(task).emoji}</span>
                    <div style={{fontSize:14,color:"#cbd5e1",lineHeight:1.35}}>{task.text}</div>
                  </div>
                  <Chips task={task}/>
                </div>
                <DoneBtn task={task}/>
                <span style={{fontSize:11,color:"#1e293b"}}>{expanded===task.id?"▲":"▼"}</span>
                <button style={S.delBtn} onClick={e=>{e.stopPropagation();deleteTask(task.id);}}>×</button>
              </div>
              {expanded===task.id&&(
                <div style={S.expPanel}>
                  <div style={S.row}>
                    <select style={S.selSm} value={task.category} onChange={e=>updateTask(task.id,{category:e.target.value})}>{user.categories.map(c=><option key={c}>{c}</option>)}</select>
                    <select style={S.selSm} value={task.effort} onChange={e=>updateTask(task.id,{effort:e.target.value})}>{Object.entries(EFFORT_LABELS).map(([k,v])=><option key={k} value={k}>{v.icon} {v[lang]}</option>)}</select>
                  </div>
                  <div style={{...S.row,marginTop:6}}>
                    <label style={S.chk}><input type="checkbox" checked={task.important} onChange={e=>updateTask(task.id,{important:e.target.checked})}/><span>★ {t.important}</span></label>
                    <label style={S.chk}><input type="checkbox" checked={task.urgent} onChange={e=>updateTask(task.id,{urgent:e.target.checked})}/><span>! {t.urgent}</span></label>
                  </div>
                  <select style={{...S.selSm,marginTop:6}} value={task.projectId||""} onChange={e=>updateTask(task.id,{projectId:e.target.value||null})}>
                    <option value="">— {t.project} —</option>
                    {(user.projects||[]).map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>
                  <div style={{marginTop:8}}>
                    <div style={{fontSize:11,color:"#334155",marginBottom:5}}>{t.subtasks}</div>
                    {(task.subtasks||[]).map(sub=>(
                      <label key={sub.id} style={{...S.chk,marginBottom:5}}>
                        <input type="checkbox" checked={sub.done} onChange={()=>toggleSub(task.id,sub.id)}/>
                        <span style={{fontSize:13,color:sub.done?"#334155":"#94a3b8",textDecoration:sub.done?"line-through":"none"}}>{sub.text}</span>
                      </label>
                    ))}
                    <div style={S.row}>
                      <input style={{...S.input,fontSize:13,padding:"8px 12px"}} value={newSubtask[task.id]||""} onChange={e=>setNewSubtask(p=>({...p,[task.id]:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addSubtask(task.id)} placeholder={t.addSubtask}/>
                      <button style={{...S.addBtn,width:38,height:38,fontSize:18}} onClick={()=>addSubtask(task.id)}>+</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>
      </div>

      {done_tasks.length>0&&(
        <div style={S.sec}>
          <div style={S.secTitle}>{t.doneTasks} ({done_tasks.length})</div>
          <div style={S.manList}>
            {done_tasks.map(task=>(
              <div key={task.id} style={{...S.manItem,opacity:.4}}>
                <span style={{fontSize:16,color:"#4ade80"}}>✓</span>
                <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,color:"#64748b",textDecoration:"line-through"}}>{task.text}</div></div>
                <button style={S.undoneBtn} onClick={()=>toggleDone(task.id)}>{t.undone}</button>
                <button style={S.delBtn} onClick={()=>deleteTask(task.id)}>×</button>
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={S.sec}>
        <div style={S.secTitle}>{t.category}</div>
        <div style={S.chipRow}>{user.categories.map(c=><span key={c} style={S.catChipLg}>{c}</span>)}</div>
        <div style={S.row}><input style={{...S.input,flex:1}} value={newCat} onChange={e=>setNewCat(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addCat()} placeholder={t.addCategory}/><button style={S.addBtn} onClick={addCat}>+</button></div>
      </div>

      <div style={S.sec}>
        <div style={S.secTitle}>{t.project}</div>
        {(user.projects||[]).map(p=>(<div key={p.id} style={{fontSize:13,color:"#475569",marginBottom:5}}>📦 {p.name} — {tasks.filter(t=>t.projectId===String(p.id)).length} {lang==="de"?"Aufgaben":"tasks"}</div>))}
        <div style={S.row}><input style={{...S.input,flex:1}} value={newProject} onChange={e=>setNewProject(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addProject()} placeholder={t.newProject}/><button style={S.addBtn} onClick={addProject}>+</button></div>
      </div>

      <div style={S.sec}>
        <div style={S.secTitle}>{t.backup}</div>
        <button style={{...S.secondaryBtn,marginBottom:8}} onClick={doExport}>{exportDone?t.exportDone:t.exportCopy}</button>
        {exportCode&&<textarea style={S.codeBox} readOnly value={exportCode} rows={3} onClick={e=>e.target.select()}/>}
        <textarea style={S.codeBox} value={importCode} onChange={e=>setImportCode(e.target.value)} placeholder={t.importPaste} rows={3}/>
        {importError&&<p style={{fontSize:12,color:"#ef4444",marginBottom:8}}>{importError}</p>}
        <button style={{...S.secondaryBtn,marginTop:6}} onClick={doImport}>{t.importBtn}</button>
        <button style={{...S.dangerBtn,marginTop:14}} onClick={()=>{if(window.confirm(t.confirmReset))restart();}}>↺ {t.resetScores}</button>
      </div>

      <Nav/>
    </div></div>
  );

  return null;
}
