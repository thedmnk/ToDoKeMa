// ── HELPERS ──────────────────────────────────────────────────────────────────
const mkId=()=>Date.now()+Math.floor(Math.random()*9999);
const hash=s=>{let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return h.toString(36)};
const monster=t=>MONSTERS[`${t.effort}-${t.imp?1:0}-${t.urg?1:0}`]||MONSTERS["small-0-0"];

const XP_TABLE=[0,100,250,500,850,1300,1900,2700,3700,5000,6500,8500,11000,14000,18000,23000,29000,36000,45000,55000];
const getLevel=xp=>{let l=1;XP_TABLE.forEach((v,i)=>{if(xp>=v)l=i+1;});return Math.min(l,20);};
const xpNext=xp=>{const l=getLevel(xp);return l>=20?XP_TABLE[19]:XP_TABLE[l];};
const xpPct=xp=>{const l=getLevel(xp),prev=XP_TABLE[l-1]||0,next=xpNext(xp);return next>prev?(xp-prev)/(next-prev)*100:100;};

function mkTask(d,i=0){
  return{id:mkId()+i,text:d.text,cat:d.cat||"Allgemein",effort:d.effort||"medium",imp:d.imp??false,urg:d.urg??false,score:0,done:false,doneAt:null,subtasks:[],projectId:null};
}

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function genPairs(tasks){
  const active=tasks.filter(t=>!t.done);
  if(active.length<2)return[];
  const sorted=[...active].sort((a,b)=>b.score-a.score);
  const tierSz=Math.max(3,Math.ceil(sorted.length/6));
  const tiers=[];
  for(let i=0;i<sorted.length;i+=tierSz)tiers.push(sorted.slice(i,i+tierSz));
  const pairs=[],added=new Set();
  const key=(a,b)=>a<b?`${a}-${b}`:`${b}-${a}`;
  for(const tier of tiers){
    const tp=[];
    for(let i=0;i<tier.length;i++)for(let j=i+1;j<tier.length;j++){const k=key(tier[i].id,tier[j].id);if(!added.has(k)){tp.push([tier[i].id,tier[j].id]);added.add(k);}}
    pairs.push(...shuffle(tp));
  }
  for(let t=0;t<tiers.length-1;t++){
    const cp=[];
    for(const a of tiers[t])for(const b of tiers[t+1]){const k=key(a.id,b.id);if(!added.has(k)){cp.push([a.id,b.id]);added.add(k);}}
    pairs.push(...shuffle(cp));
  }
  return pairs;
}

// ── ROOT APP ─────────────────────────────────────────────────────────────────
function App(){
  const [lang,setLang]=useState("de");
  const [state,setState]=useState(null);
  const [user,setUser]=useState(null);
  const t=T[lang];

  useEffect(()=>{
    const saved=load();
    setState(saved||{users:[],v:VER});
  },[]);

  useEffect(()=>{if(state)save(state);},[state]);

  const updState=fn=>setState(p=>fn(p));
  const updUser=fn=>updState(p=>({...p,users:p.users.map(u=>u.name===user?fn(u):u)}));
  const getUser=()=>state?.users?.find(u=>u.name===user);

  if(!state)return <div style={{minHeight:"100dvh",background:"#0a0a0f",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{color:"#334155",fontSize:24}}>⚔️</span></div>;

  if(!user)return <AuthScreen t={t} lang={lang} setLang={setLang} state={state} onAuth={(name,cls,tasks,pairs)=>{
    updState(p=>({...p,users:[...(p.users||[]),{name,heroClass:cls,tasks,pairs,ci:0,cats:[...CATS],projects:[],xp:0,clanXp:0,ach:[]}]}));
    setUser(name);
  }} onLogin={name=>setUser(name)}/>;

  const u=getUser();
  if(!u){setUser(null);return null;}
  return <UserApp u={u} updUser={updUser} lang={lang} setLang={setLang} t={t} onLogout={()=>setUser(null)}/>;
}

// ── AUTH ─────────────────────────────────────────────────────────────────────
function AuthScreen({t,lang,setLang,state,onAuth,onLogin}){
  const [mode,setMode]=useState("login");
  const [name,setName]=useState("");
  const [pw,setPw]=useState("");
  const [cls,setCls]=useState("knight");
  const [err,setErr]=useState("");

  const doLogin=()=>{
    const u=state.users?.find(u=>u.name.toLowerCase()===name.trim().toLowerCase());
    if(!u){setErr(t.noacc);return;}
    if(u.passHash!==hash(pw)){setErr(t.wrongpw);return;}
    onLogin(u.name);
  };
  const doReg=()=>{
    const n=name.trim();
    if(!n||!pw)return;
    if(state.users?.find(u=>u.name.toLowerCase()===n.toLowerCase())){setErr(t.exists);return;}
    const tasks=DEFAULT_TASKS.map((d,i)=>mkTask(d,i));
    onAuth(n,cls,tasks,genPairs(tasks));
  };

  return(
    <div style={{minHeight:"100dvh",background:"linear-gradient(160deg,#0a0a0f,#0f0f1a)",display:"flex",alignItems:"center",justifyContent:"center",padding:"0 20px"}}>
      <div style={{width:"100%",maxWidth:380,background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:24,padding:"32px 24px",marginTop:"var(--sat)"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:28}}>
          <Logo sz={56}/>
          <div>
            <div style={{fontSize:24,fontWeight:800,color:"#f1f5f9",letterSpacing:"-1px"}}>ToDoKeMa</div>
            <div style={{fontSize:11,color:"#475569",letterSpacing:"1px"}}>To · Do · Ke · Ma</div>
          </div>
        </div>

        <div style={{marginBottom:14}}>
          <label style={{display:"block",fontSize:11,color:"#475569",marginBottom:5,letterSpacing:"0.5px"}}>{t.name.toUpperCase()}</label>
          <input style={IS} value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&(mode==="login"?doLogin():doReg())} placeholder="z.B. Dom" autoFocus/>
        </div>
        <div style={{marginBottom:16}}>
          <label style={{display:"block",fontSize:11,color:"#475569",marginBottom:5,letterSpacing:"0.5px"}}>{t.pw.toUpperCase()}</label>
          <input style={IS} type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&(mode==="login"?doLogin():doReg())} placeholder="••••••"/>
        </div>

        {mode==="register"&&(
          <div style={{marginBottom:16}}>
            <label style={{display:"block",fontSize:11,color:"#475569",marginBottom:8,letterSpacing:"0.5px"}}>{t.chooseClass.toUpperCase()}</label>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {CLASSES.map(c=>(
                <button key={c.id} onClick={()=>setCls(c.id)} style={{padding:"10px 8px",background:cls===c.id?"rgba(99,102,241,0.2)":"rgba(255,255,255,0.03)",border:`1.5px solid ${cls===c.id?"#6366f1":"rgba(255,255,255,0.08)"}`,borderRadius:12,color:cls===c.id?"#e2e8f0":"#64748b",cursor:"pointer",textAlign:"center"}}>
                  <div style={{fontSize:24,marginBottom:3}}>{c.icon}</div>
                  <div style={{fontSize:12}}>{c[lang]||c.de}</div>
                </button>
              ))}
            </div>
          </div>
        )}

        {err&&<p style={{fontSize:12,color:"#ef4444",marginBottom:12}}>{err}</p>}

        <button onClick={mode==="login"?doLogin:doReg} style={PB}>{mode==="login"?t.login:t.reg}</button>
        <p style={{fontSize:12,color:"#475569",textAlign:"center",marginTop:14}}>
          {mode==="login"?t.noacc:t.haveacc}{" "}
          <span style={{color:"#818cf8",cursor:"pointer"}} onClick={()=>{setMode(mode==="login"?"register":"login");setErr("");}}>
            {mode==="login"?t.reg:t.login}
          </span>
        </p>
        <button onClick={()=>setLang(l=>l==="de"?"en":"de")} style={{width:"100%",marginTop:16,padding:"8px",background:"transparent",border:"1px solid rgba(255,255,255,0.07)",borderRadius:8,color:"#334155",cursor:"pointer",fontSize:12}}>{t.lang}</button>
      </div>
    </div>
  );
}

// ── USER APP ─────────────────────────────────────────────────────────────────
function UserApp({u,updUser,lang,setLang,t,onLogout}){
  const [view,setView]=useState("compare");
  const [chosen,setChosen]=useState(null);
  const [anim,setAnim]=useState(false);
  const [victory,setVictory]=useState(null);
  const [dot,setDot]=useState(null);
  const [tlSort,setTlSort]=useState("date");
  const [expanded,setExpanded]=useState(null);
  const [newTask,setNewTask]=useState({text:"",cat:"Allgemein",effort:"medium",imp:false,urg:false});
  const [newSub,setNewSub]=useState({});
  const [newProj,setNewProj]=useState("");
  const [newCat,setNewCat]=useState("");
  const [expCode,setExpCode]=useState("");
  const [impCode,setImpCode]=useState("");
  const [copied,setCopied]=useState(false);
  const [impErr,setImpErr]=useState("");
  const [filterCat,setFilterCat]=useState("all");
  const inputRef=useRef(null);

  const tasks=u.tasks||[];
  const active=tasks.filter(t=>!t.done);
  const doneTasks=tasks.filter(t=>t.done);
  const pairs=u.pairs||genPairs(active);
  const ci=u.ci||0;
  const total=pairs.length;
  const allDone=ci>=total;
  const prog=Math.min((ci/Math.max(total,1))*100,100);
  const sorted=[...active].sort((a,b)=>b.score-a.score);
  const maxScore=Math.max(sorted[0]?.score||1,1);
  const gt=id=>tasks.find(t=>t.id===id);
  const rankEmoji=i=>["🥇","🥈","🥉"][i]||`${i+1}.`;
  const heroClass=CLASSES.find(c=>c.id===u.heroClass)||CLASSES[0];
  const xp=u.xp||0;
  const lvl=getLevel(xp);

  const toggleDone=id=>{
    updUser(u=>{
      const task=u.tasks.find(t=>t.id===id);
      const nd=!task.done;
      const updated=u.tasks.map(t=>t.id===id?{...t,done:nd,doneAt:nd?new Date().toISOString():null}:t);
      if(nd){
        const m=monster(task);
        let xpGain=m.xp;
        if(task.imp)xpGain=Math.round(xpGain*1.25);
        if(task.urg)xpGain=Math.round(xpGain*1.2);
        const newXp=(u.xp||0)+xpGain;
        setTimeout(()=>{setVictory({m,xp:xpGain,text:task.text});setTimeout(()=>setVictory(null),2500);},50);
        return{...u,tasks:updated,pairs:genPairs(updated),ci:0,xp:newXp,clanXp:(u.clanXp||0)+xpGain};
      }
      return{...u,tasks:updated,pairs:genPairs(updated),ci:0};
    });
  };

  const choose=wid=>{
    if(anim)return;
    setChosen(wid);setAnim(true);
    setTimeout(()=>{
      updUser(u=>{
        const updated=u.tasks.map(t=>t.id===wid?{...t,score:t.score+1}:t);
        return{...u,tasks:updated,pairs:genPairs(updated),ci:(u.ci||0)+1};
      });
      setChosen(null);setAnim(false);
    },280);
  };

  const skip=()=>{if(!anim)updUser(u=>({...u,ci:(u.ci||0)+1}));};

  const restart=()=>{
    updUser(u=>{const r=u.tasks.map(t=>({...t,score:0}));return{...u,tasks:r,pairs:genPairs(r.filter(t=>!t.done)),ci:0};});
    setView("compare");
  };

  const addTask=()=>{
    if(!newTask.text.trim())return;
    const nt=mkTask(newTask);
    updUser(u=>{const upd=[...u.tasks,nt];return{...u,tasks:upd,pairs:genPairs(upd.filter(t=>!t.done)),ci:0};});
    setNewTask({text:"",cat:newTask.cat,effort:"medium",imp:false,urg:false});
    inputRef.current?.focus();
  };

  const delTask=id=>updUser(u=>{const upd=u.tasks.filter(t=>t.id!==id);return{...u,tasks:upd,pairs:genPairs(upd.filter(t=>!t.done)),ci:0};});
  const updTask=(id,ch)=>updUser(u=>({...u,tasks:u.tasks.map(t=>t.id===id?{...t,...ch}:t)}));
  const addSub=tid=>{const tx=(newSub[tid]||"").trim();if(!tx)return;updUser(u=>({...u,tasks:u.tasks.map(t=>t.id===tid?{...t,subtasks:[...(t.subtasks||[]),{id:mkId(),text:tx,done:false}]}:t)}));setNewSub(p=>({...p,[tid]:""}));};
  const togSub=(tid,sid)=>updUser(u=>({...u,tasks:u.tasks.map(t=>t.id===tid?{...t,subtasks:t.subtasks.map(s=>s.id===sid?{...s,done:!s.done}:s)}:t)}));
  const addProj=()=>{if(!newProj.trim())return;updUser(u=>({...u,projects:[...(u.projects||[]),{id:mkId(),name:newProj.trim()}]}));setNewProj("");};
  const addCat=()=>{if(!newCat.trim()||u.cats.includes(newCat.trim()))return;updUser(u=>({...u,cats:[...u.cats,newCat.trim()]}));setNewCat("");};

  const doExport=()=>{
    const code=btoa(JSON.stringify({v:VER,tasks:u.tasks,cats:u.cats,projects:u.projects}));
    setExpCode(code);
    try{navigator.clipboard.writeText(code);setCopied(true);setTimeout(()=>setCopied(false),2000);}catch{}
  };
  const doImport=()=>{
    try{
      const d=JSON.parse(atob(impCode.trim()));
      if(!d.tasks)throw new Error();
      updUser(u=>({...u,tasks:d.tasks,cats:d.cats||u.cats,projects:d.projects||u.projects,pairs:genPairs(d.tasks),ci:0}));
      setImpCode("");setImpErr("");
    }catch{setImpErr("Ungültiger Code");}
  };

  // Timeline
  const tlTasks=[...doneTasks].sort((a,b)=>new Date(b.doneAt||0)-new Date(a.doneAt||0));
  const gDate={},gCat={};
  tlTasks.forEach(tk=>{
    const d=tk.doneAt?new Date(tk.doneAt).toLocaleDateString(lang==="de"?"de-DE":"en-GB",{day:"2-digit",month:"long",year:"numeric"}):"—";
    if(!gDate[d])gDate[d]=[];gDate[d].push(tk);
    if(!gCat[tk.cat])gCat[tk.cat]=[];gCat[tk.cat].push(tk);
  });

  // Pair match quality
  const pair=pairs[ci];
  const tA=pair?gt(pair[0]):null,tB=pair?gt(pair[1]):null;
  const valid=tA&&tB&&!tA.done&&!tB.done;
  const diff=tA&&tB?Math.abs(tA.score-tB.score):0;
  const matchBadge=diff===0?t.matchtie:diff<=2?t.matchclose:diff<=5?t.matchfar:t.matchcross;

  // ── SHARED COMPONENTS ──────────────────────────────────────────────────────
  const DBtn=({task,lg})=>(
    <button onClick={e=>{e.stopPropagation();toggleDone(task.id);}} style={{width:lg?38:28,height:lg?38:28,borderRadius:"50%",background:task.done?"rgba(74,222,128,0.15)":"rgba(255,255,255,0.04)",border:`1px solid ${task.done?"#4ade80":"rgba(255,255,255,0.1)"}`,color:task.done?"#4ade80":"#334155",cursor:"pointer",fontSize:lg?16:13,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all 0.2s"}}>
      {task.done?"✓":"○"}
    </button>
  );

  const Chips=({task})=>{
    const m=monster(task);
    return(
      <div style={{display:"flex",flexWrap:"wrap",gap:5,alignItems:"center",marginTop:4}}>
        <span style={{fontSize:16}}>{m.e}</span>
        <span style={{fontSize:10,color:"#6366f1",background:"#6366f115",padding:"2px 7px",borderRadius:99}}>{task.cat}</span>
        <span style={{fontSize:10,color:"#64748b",background:"rgba(255,255,255,0.05)",padding:"2px 7px",borderRadius:99}}>{EFFORTS[task.effort]?.icon} {EFFORTS[task.effort]?.[lang]||EFFORTS[task.effort]?.de}</span>
        {task.imp&&<span style={{fontSize:10,color:"#f59e0b",background:"#f59e0b15",padding:"2px 6px",borderRadius:99}}>★</span>}
        {task.urg&&<span style={{fontSize:10,color:"#ef4444",background:"#ef444415",padding:"2px 6px",borderRadius:99}}>!</span>}
        {task.subtasks?.length>0&&<span style={{fontSize:10,color:"#475569"}}>↳{task.subtasks.filter(s=>s.done).length}/{task.subtasks.length}</span>}
      </div>
    );
  };

  const Nav=()=>(
    <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:600,display:"flex",background:"rgba(8,8,15,0.97)",borderTop:"1px solid rgba(255,255,255,0.07)",backdropFilter:"blur(20px)",zIndex:100,paddingBottom:"var(--sab)"}}>
      {[{id:"compare",icon:"⚖️"},{id:"matrix",icon:"🔲"},{id:"ranking",icon:"🏆"},{id:"hero",icon:"⚔️"},{id:"timeline",icon:"✅"},{id:"manage",icon:"⚙️"}].map(({id,icon})=>(
        <button key={id} onClick={()=>setView(id)} style={{flex:1,padding:"10px 2px 10px",background:"transparent",border:"none",borderTop:`2.5px solid ${view===id?"#6366f1":"transparent"}`,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
          <span style={{fontSize:20}}>{icon}</span>
          <span style={{fontSize:9,color:view===id?"#a78bfa":"#334155"}}>{t[id]||id}</span>
        </button>
      ))}
    </div>
  );

  const Header=({title})=>(
    <div style={{paddingTop:"calc(var(--sat) + 12px)",paddingBottom:0}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"0 16px 8px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <Logo sz={36}/>
          <div>
            <div style={{fontSize:19,fontWeight:700,color:"#f1f5f9",letterSpacing:"-0.5px"}}>{title}</div>
            <div style={{fontSize:10,color:"#334155"}}>{u.name} · {active.length} aktiv · {doneTasks.length} ✓ · v{VER}</div>
          </div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>setLang(l=>l==="de"?"en":"de")} style={IB}>{t.lang}</button>
          <button onClick={onLogout} style={IB}>↩</button>
        </div>
      </div>
      {/* XP Bar */}
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"0 16px 10px"}}>
        <span style={{fontSize:16}}>{heroClass.icon}</span>
        <div style={{flex:1}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
            <span style={{fontSize:10,color:"#a78bfa"}}>{t.level} {lvl} · {heroClass[lang]||heroClass.de}</span>
            <span style={{fontSize:10,color:"#475569"}}>{xp} XP</span>
          </div>
          <div style={{height:4,background:"rgba(255,255,255,0.06)",borderRadius:99,overflow:"hidden"}}>
            <div style={{height:"100%",width:`${xpPct(xp)}%`,background:"linear-gradient(90deg,#f59e0b,#fbbf24)",borderRadius:99,transition:"width 0.6s ease"}}/>
          </div>
        </div>
      </div>
    </div>
  );

  // Victory overlay
  const Victory=()=>victory?(
    <div style={{position:"fixed",inset:0,display:"flex",alignItems:"center",justifyContent:"center",zIndex:999,pointerEvents:"none"}}>
      <div style={{background:"rgba(10,10,15,0.96)",border:"2px solid #f59e0b",borderRadius:24,padding:"28px 36px",textAlign:"center",boxShadow:"0 0 60px rgba(245,158,11,0.25)",animation:"pop 0.3s ease"}}>
        <div style={{fontSize:60,marginBottom:6}}>{victory.m.e}</div>
        <div style={{fontSize:13,color:"#ef4444",marginBottom:4}}>{victory.m[lang]||victory.m.de} {t.defeated}!</div>
        <div style={{fontSize:26,fontWeight:800,color:"#fbbf24"}}>+{victory.xp} XP ⚔️</div>
        <div style={{fontSize:11,color:"#475569",marginTop:6,maxWidth:180,textAlign:"center",lineHeight:1.4}}>{victory.text}</div>
      </div>
    </div>
  ):null;

  const Page=({children})=>(
    <div style={{minHeight:"100dvh",background:"linear-gradient(160deg,#0a0a0f,#0f1117 50%,#0a0a0f)",display:"flex",justifyContent:"center"}}>
      <div style={{width:"100%",maxWidth:600,minHeight:"100dvh",background:"rgba(255,255,255,0.018)",borderLeft:"1px solid rgba(255,255,255,0.05)",borderRight:"1px solid rgba(255,255,255,0.05)",paddingBottom:"calc(80px + var(--sab))"}}>
        {children}
      </div>
      <Victory/>
    </div>
  );

  // ── COMPARE ────────────────────────────────────────────────────────────────
  if(view==="compare")return(
    <Page>
      <Header title={t.compare}/>
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"0 16px",marginBottom:14}}>
        <div style={{flex:1,height:4,background:"rgba(255,255,255,0.06)",borderRadius:99,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${prog}%`,background:"linear-gradient(90deg,#4f46e5,#7c3aed)",borderRadius:99,transition:"width 0.4s"}}/>
        </div>
        <span style={{fontSize:10,color:"#334155",minWidth:44,textAlign:"right"}}>{ci}/{total}</span>
      </div>
      {valid&&<div style={{textAlign:"center",fontSize:12,color:"#475569",marginBottom:12}}>{matchBadge}</div>}
      {allDone||!valid?(
        <div style={{textAlign:"center",padding:"40px 20px"}}>
          <div style={{fontSize:56,marginBottom:12}}>🎉</div>
          <p style={{color:"#64748b",fontSize:16,marginBottom:24}}>{t.alldone}</p>
          <button onClick={()=>setView("ranking")} style={{...PB,marginBottom:10}}>{t.showrank}</button>
          <button onClick={restart} style={SB}>{t.restart}</button>
        </div>
      ):(
        <>
          <p style={{fontSize:15,color:"#64748b",textAlign:"center",marginBottom:14,padding:"0 16px"}}><em>{t.whats}</em></p>
          <div style={{display:"flex",gap:10,padding:"0 16px",marginBottom:14}}>
            {[tA,tB].map(task=>(
              <div key={task.id} style={{flex:1,display:"flex",flexDirection:"column",gap:8}}>
                <button onClick={()=>choose(task.id)} disabled={anim} style={{width:"100%",aspectRatio:"1/1",minHeight:150,padding:"14px 12px",background:chosen===task.id?"rgba(79,70,229,0.2)":"rgba(255,255,255,0.04)",border:`1.5px solid ${chosen===task.id?"#4f46e5":"rgba(255,255,255,0.09)"}`,borderRadius:18,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:8,textAlign:"center",outline:"none",transition:"all 0.2s",transform:chosen===task.id?"scale(1.02)":"scale(1)"}}>
                  <span style={{fontSize:40}}>{monster(task).e}</span>
                  <span style={{fontSize:14,color:"#e2e8f0",lineHeight:1.35}}>{task.text}</span>
                  <Chips task={task}/>
                  <span style={{fontSize:10,color:monster(task).col}}>+{monster(task).xp} XP</span>
                </button>
                <div style={{display:"flex",justifyContent:"center"}}><DBtn task={task} lg/></div>
              </div>
            ))}
          </div>
          <div style={{padding:"0 16px"}}>
            <button onClick={skip} style={SB}>{t.skip}</button>
          </div>
        </>
      )}
      <Nav/>
    </Page>
  );

  // ── MATRIX ─────────────────────────────────────────────────────────────────
  if(view==="matrix"){
    const scoreMax=Math.max(...active.map(t=>t.score),1);
    const getDot=task=>{
      const jx=((task.id%17)/17-0.5)*26,jy=((task.id%13)/13-0.5)*16;
      const x=Math.min(93,Math.max(7,(task.urg?65:35)+jx));
      const y=Math.min(93,Math.max(7,85-(task.score/scoreMax)*70+jy));
      return{x,y};
    };
    const dotCol=task=>task.imp&&task.urg?"#ef4444":task.imp?"#6366f1":task.urg?"#f59e0b":"#475569";

    return(
      <Page>
        <Header title={t.matrix}/>
        <div style={{padding:"0 16px"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
            <span style={{fontSize:10,color:"#334155"}}>← {t.noturg}</span>
            <span style={{fontSize:10,color:"#334155"}}>{t.urgent} →</span>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <span style={{fontSize:9,color:"#334155",writingMode:"vertical-rl",transform:"rotate(180deg)"}}>{t.important} ↑</span>
            <svg viewBox="0 0 100 100" style={{flex:1,aspectRatio:"1/1",borderRadius:14,border:"1px solid rgba(255,255,255,0.07)",background:"rgba(255,255,255,0.02)",overflow:"visible",cursor:"pointer"}} onClick={e=>{if(e.target.tagName!=="circle")setDot(null);}}>
              <rect x="0" y="0" width="50" height="50" fill="rgba(99,102,241,0.06)"/>
              <rect x="50" y="0" width="50" height="50" fill="rgba(239,68,68,0.06)"/>
              <rect x="0" y="50" width="50" height="50" fill="rgba(71,85,105,0.04)"/>
              <rect x="50" y="50" width="50" height="50" fill="rgba(245,158,11,0.04)"/>
              <line x1="50" y1="0" x2="50" y2="100" stroke="rgba(255,255,255,0.07)" strokeWidth="0.5" strokeDasharray="2,2"/>
              <line x1="0" y1="50" x2="100" y2="50" stroke="rgba(255,255,255,0.07)" strokeWidth="0.5" strokeDasharray="2,2"/>
              {active.map(task=>{
                const{x,y}=getDot(task);
                const sel=dot?.id===task.id;
                const col=dotCol(task);
                return(
                  <g key={task.id} onClick={e=>{e.stopPropagation();setDot(sel?null:task);}}>
                    {sel&&<circle cx={x} cy={y} r="5.5" fill={col} opacity="0.2"/>}
                    <circle cx={x} cy={y} r={sel?3.8:2.8} fill={col} stroke={sel?"white":"rgba(255,255,255,0.25)"} strokeWidth={sel?"0.8":"0.3"} style={{cursor:"pointer",transition:"all 0.2s"}}/>
                  </g>
                );
              })}
            </svg>
          </div>
          <div style={{textAlign:"center",marginTop:6}}>
            <span style={{fontSize:9,color:"#334155"}}>↓ {t.unimportant}</span>
          </div>
          {/* Legend */}
          <div style={{display:"flex",flexWrap:"wrap",gap:10,justifyContent:"center",marginTop:10}}>
            {[["#6366f1",t.important],["#ef4444",`${t.important}+${t.urgent}`],["#f59e0b",t.urgent],["#475569","—"]].map(([col,label])=>(
              <div key={label} style={{display:"flex",alignItems:"center",gap:5}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:col}}/>
                <span style={{fontSize:10,color:"#475569"}}>{label}</span>
              </div>
            ))}
          </div>
          {dot&&(
            <div style={{marginTop:12,padding:"14px",background:"rgba(255,255,255,0.04)",border:`1px solid ${dotCol(dot)}44`,borderRadius:14}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:14,color:"#e2e8f0",lineHeight:1.4,marginBottom:6}}>{dot.text}</div>
                  <Chips task={dot}/>
                  <div style={{display:"flex",gap:10,marginTop:8}}>
                    <span style={{fontSize:11,color:"#475569"}}>Score: {dot.score}</span>
                  </div>
                </div>
                <DBtn task={dot}/>
              </div>
            </div>
          )}
          <div style={{textAlign:"center",marginTop:8}}>
            <span style={{fontSize:10,color:"#1e293b"}}>{active.length} tasks · {t.taptask}</span>
          </div>
        </div>
        <Nav/>
      </Page>
    );
  }

  // ── RANKING ────────────────────────────────────────────────────────────────
  if(view==="ranking"){
    const fil=sorted.filter(t=>filterCat==="all"||t.cat===filterCat);
    return(
      <Page>
        <Header title={t.ranking}/>
        <div style={{display:"flex",gap:6,padding:"0 16px 12px",flexWrap:"wrap"}}>
          <button onClick={()=>setFilterCat("all")} style={{fontSize:10,padding:"3px 10px",background:filterCat==="all"?"#4f46e520":"rgba(255,255,255,0.04)",border:`1px solid ${filterCat==="all"?"#4f46e5":"rgba(255,255,255,0.08)"}`,borderRadius:99,color:filterCat==="all"?"#818cf8":"#475569",cursor:"pointer"}}>{t.ranking}</button>
          {u.cats.map(c=>(
            <button key={c} onClick={()=>setFilterCat(c)} style={{fontSize:10,padding:"3px 10px",background:filterCat===c?"#4f46e520":"rgba(255,255,255,0.04)",border:`1px solid ${filterCat===c?"#4f46e5":"rgba(255,255,255,0.08)"}`,borderRadius:99,color:filterCat===c?"#818cf8":"#475569",cursor:"pointer"}}>{c}</button>
          ))}
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:6,padding:"0 16px"}}>
          {fil.map((task,i)=>(
            <div key={task.id} style={{display:"flex",alignItems:"center",gap:8,padding:"12px 14px",borderRadius:14,border:"1px solid",background:i===0?"#f59e0b09":i<3?"#6366f109":"rgba(255,255,255,0.03)",borderColor:i===0?"#f59e0b33":i<3?"#6366f133":"rgba(255,255,255,0.07)"}}>
              <span style={{fontSize:16,minWidth:26,textAlign:"center"}}>{rankEmoji(i)}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                  <span style={{fontSize:18}}>{monster(task).e}</span>
                  <span style={{fontSize:13,color:"#cbd5e1",lineHeight:1.3}}>{task.text}</span>
                </div>
                <Chips task={task}/>
              </div>
              <div style={{width:36,height:3,background:"rgba(255,255,255,0.06)",borderRadius:99,overflow:"hidden",flexShrink:0}}>
                <div style={{height:"100%",width:`${(task.score/maxScore)*100}%`,background:i===0?"#f59e0b":i<3?"#818cf8":"#334155",borderRadius:99}}/>
              </div>
              <span style={{fontSize:10,color:"#334155",minWidth:18,textAlign:"right"}}>{task.score}</span>
              <DBtn task={task}/>
            </div>
          ))}
        </div>
        <Nav/>
      </Page>
    );
  }

  // ── HERO ───────────────────────────────────────────────────────────────────
  if(view==="hero"){
    const monCounts={};
    active.forEach(task=>{const m=monster(task);const k=m[lang]||m.de;if(!monCounts[k])monCounts[k]={m,left:0,done:0};monCounts[k].left++;});
    doneTasks.forEach(task=>{const m=monster(task);const k=m[lang]||m.de;if(!monCounts[k])monCounts[k]={m,left:0,done:0};monCounts[k].done++;});
    return(
      <Page>
        <Header title={t.hero}/>
        <div style={{padding:"0 16px 12px"}}>
          {/* Hero card */}
          <div style={{background:"linear-gradient(135deg,rgba(99,102,241,0.12),rgba(124,58,237,0.08))",border:"1px solid rgba(99,102,241,0.25)",borderRadius:18,padding:"18px",marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:14}}>
              <span style={{fontSize:52}}>{heroClass.icon}</span>
              <div>
                <div style={{fontSize:20,fontWeight:700,color:"#f1f5f9"}}>{u.name}</div>
                <div style={{fontSize:13,color:"#818cf8"}}>{heroClass[lang]||heroClass.de} · {t.level} {lvl}</div>
                <div style={{fontSize:11,color:"#475569"}}>{xp} / {xpNext(xp)} XP</div>
              </div>
            </div>
            <div style={{height:8,background:"rgba(255,255,255,0.06)",borderRadius:99,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${xpPct(xp)}%`,background:"linear-gradient(90deg,#f59e0b,#fbbf24)",borderRadius:99,transition:"width 0.6s"}}/>
            </div>
          </div>
          {/* Stats */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}>
            {[{l:t.defeated,v:doneTasks.length,i:"⚔️"},{l:t.remaining,v:active.length,i:"🐉"},{l:"Clan XP",v:u.clanXp||0,i:"🏰"}].map(({l,v,i})=>(
              <div key={l} style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:"12px 8px",textAlign:"center"}}>
                <div style={{fontSize:22,marginBottom:4}}>{i}</div>
                <div style={{fontSize:20,fontWeight:700,color:"#f1f5f9"}}>{v}</div>
                <div style={{fontSize:10,color:"#475569"}}>{l}</div>
              </div>
            ))}
          </div>
          {/* Bestiary */}
          <div style={{fontSize:10,color:"#1e293b",marginBottom:10,letterSpacing:"0.8px"}}>{t.bestiary.toUpperCase()}</div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {Object.values(monCounts).sort((a,b)=>b.m.xp-a.m.xp).map(({m,left,done})=>(
              <div key={m.de} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:12}}>
                <span style={{fontSize:26}}>{m.e}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,color:"#cbd5e1"}}>{m[lang]||m.de}</div>
                  <div style={{fontSize:10,color:"#475569"}}>{done} {t.defeated} · {left} {t.remaining}</div>
                </div>
                <span style={{fontSize:12,color:m.col}}>+{m.xp} XP</span>
              </div>
            ))}
          </div>
        </div>
        <Nav/>
      </Page>
    );
  }

  // ── TIMELINE ───────────────────────────────────────────────────────────────
  if(view==="timeline"){
    const groups=tlSort==="date"?gDate:gCat;
    return(
      <Page>
        <Header title={t.done}/>
        <div style={{display:"flex",gap:8,padding:"0 16px 14px"}}>
          <button onClick={()=>setTlSort("date")} style={{padding:"5px 14px",background:tlSort==="date"?"#4f46e520":"rgba(255,255,255,0.04)",border:`1px solid ${tlSort==="date"?"#4f46e5":"rgba(255,255,255,0.08)"}`,borderRadius:99,color:tlSort==="date"?"#818cf8":"#475569",cursor:"pointer",fontSize:11}}>📅 {t.sortdate}</button>
          <button onClick={()=>setTlSort("cat")} style={{padding:"5px 14px",background:tlSort==="cat"?"#4f46e520":"rgba(255,255,255,0.04)",border:`1px solid ${tlSort==="cat"?"#4f46e5":"rgba(255,255,255,0.08)"}`,borderRadius:99,color:tlSort==="cat"?"#818cf8":"#475569",cursor:"pointer",fontSize:11}}>🏷️ {t.sortcat}</button>
        </div>
        {doneTasks.length===0?(
          <div style={{textAlign:"center",padding:"60px 20px"}}><div style={{fontSize:52,marginBottom:12}}>🎯</div><p style={{color:"#334155",fontSize:15}}>{lang==="de"?"Noch nichts erledigt":"Nothing done yet"}</p></div>
        ):(
          <div style={{padding:"0 16px"}}>
            {Object.keys(groups).map(key=>(
              <div key={key} style={{marginBottom:20}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                  <div style={{flex:1,height:1,background:"rgba(255,255,255,0.06)"}}/>
                  <span style={{fontSize:11,color:"#475569",whiteSpace:"nowrap"}}>{tlSort==="date"?`📅 ${key}`:`🏷️ ${key}`} <span style={{background:"rgba(255,255,255,0.06)",borderRadius:99,padding:"1px 7px",fontSize:10}}>{groups[key].length}</span></span>
                  <div style={{flex:1,height:1,background:"rgba(255,255,255,0.06)"}}/>
                </div>
                {groups[key].map(task=>(
                  <div key={task.id} style={{display:"flex",gap:10,marginBottom:8}}>
                    <div style={{width:9,height:9,borderRadius:"50%",background:"#4ade80",flexShrink:0,marginTop:5,boxShadow:"0 0 8px #4ade8077"}}/>
                    <div style={{flex:1,background:"rgba(74,222,128,0.04)",border:"1px solid rgba(74,222,128,0.12)",borderRadius:12,padding:"11px 13px"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                        <div style={{flex:1}}>
                          <div style={{fontSize:14,color:"#86efac",lineHeight:1.3,marginBottom:5}}>{task.text}</div>
                          <Chips task={task}/>
                          {tlSort!=="date"&&<div style={{fontSize:10,color:"#334155",marginTop:4}}>{task.doneAt?new Date(task.doneAt).toLocaleDateString(lang==="de"?"de-DE":"en-GB",{day:"2-digit",month:"short",year:"numeric"}):"—"}</div>}
                        </div>
                        <button onClick={()=>toggleDone(task.id)} style={{background:"transparent",border:"none",color:"#334155",cursor:"pointer",fontSize:16}}>↩</button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            ))}
          </div>
        )}
        <Nav/>
      </Page>
    );
  }

  // ── MANAGE ─────────────────────────────────────────────────────────────────
  if(view==="manage")return(
    <Page>
      <Header title={t.manage}/>

      <div style={SEC}>
        <div style={SECTL}>{t.addtask}</div>
        <input ref={inputRef} style={IS} value={newTask.text} onChange={e=>setNewTask(p=>({...p,text:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addTask()} placeholder={t.newtask}/>
        <div style={{display:"flex",gap:8,marginTop:8}}>
          <select style={SEL} value={newTask.cat} onChange={e=>setNewTask(p=>({...p,cat:e.target.value}))}>{u.cats.map(c=><option key={c}>{c}</option>)}</select>
          <select style={SEL} value={newTask.effort} onChange={e=>setNewTask(p=>({...p,effort:e.target.value}))}>{Object.entries(EFFORTS).map(([k,v])=><option key={k} value={k}>{v.icon} {v[lang]||v.de}</option>)}</select>
        </div>
        <div style={{display:"flex",gap:16,marginTop:10}}>
          <label style={{display:"flex",alignItems:"center",gap:6,fontSize:13,color:"#64748b",cursor:"pointer"}}><input type="checkbox" checked={newTask.imp} onChange={e=>setNewTask(p=>({...p,imp:e.target.checked}))}/> ★ {t.imp}</label>
          <label style={{display:"flex",alignItems:"center",gap:6,fontSize:13,color:"#64748b",cursor:"pointer"}}><input type="checkbox" checked={newTask.urg} onChange={e=>setNewTask(p=>({...p,urg:e.target.checked}))}/> ! {t.urg}</label>
        </div>
        <button onClick={addTask} style={{...PB,marginTop:10}}>{t.addtask}</button>
      </div>

      <div style={SEC}>
        <div style={SECTL}>{t.activetasks} ({active.length})</div>
        <div style={{display:"flex",flexDirection:"column",gap:5,maxHeight:320,overflowY:"auto"}}>
          {active.map((task,i)=>(
            <div key={task.id}>
              <div onClick={()=>setExpanded(expanded===task.id?null:task.id)} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:11,cursor:"pointer"}}>
                <span style={{fontSize:10,color:"#1e293b",minWidth:16}}>{i+1}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                    <span style={{fontSize:16}}>{monster(task).e}</span>
                    <span style={{fontSize:13,color:"#cbd5e1",lineHeight:1.3}}>{task.text}</span>
                  </div>
                  <Chips task={task}/>
                </div>
                <DBtn task={task}/>
                <span style={{fontSize:10,color:"#1e293b"}}>{expanded===task.id?"▲":"▼"}</span>
                <button onClick={e=>{e.stopPropagation();delTask(task.id);}} style={{background:"transparent",border:"none",color:"#1e293b",cursor:"pointer",fontSize:18,padding:"0 2px"}}>×</button>
              </div>
              {expanded===task.id&&(
                <div style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.05)",borderTop:"none",borderRadius:"0 0 11px 11px",padding:"10px 12px",marginBottom:2}}>
                  <div style={{display:"flex",gap:8}}>
                    <select style={SEL} value={task.cat} onChange={e=>updTask(task.id,{cat:e.target.value})}>{u.cats.map(c=><option key={c}>{c}</option>)}</select>
                    <select style={SEL} value={task.effort} onChange={e=>updTask(task.id,{effort:e.target.value})}>{Object.entries(EFFORTS).map(([k,v])=><option key={k} value={k}>{v.icon} {v[lang]||v.de}</option>)}</select>
                  </div>
                  <div style={{display:"flex",gap:14,marginTop:8}}>
                    <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#64748b",cursor:"pointer"}}><input type="checkbox" checked={task.imp} onChange={e=>updTask(task.id,{imp:e.target.checked})}/> ★ {t.imp}</label>
                    <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#64748b",cursor:"pointer"}}><input type="checkbox" checked={task.urg} onChange={e=>updTask(task.id,{urg:e.target.checked})}/> ! {t.urg}</label>
                  </div>
                  <select style={{...SEL,marginTop:8,width:"100%"}} value={task.projectId||""} onChange={e=>updTask(task.id,{projectId:e.target.value||null})}>
                    <option value="">— {t.proj} —</option>
                    {(u.projects||[]).map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>
                  <div style={{marginTop:10}}>
                    <div style={{fontSize:11,color:"#334155",marginBottom:6}}>{t.subtasks}</div>
                    {(task.subtasks||[]).map(s=>(
                      <label key={s.id} style={{display:"flex",alignItems:"center",gap:6,marginBottom:5,cursor:"pointer"}}>
                        <input type="checkbox" checked={s.done} onChange={()=>togSub(task.id,s.id)}/>
                        <span style={{fontSize:12,color:s.done?"#334155":"#94a3b8",textDecoration:s.done?"line-through":"none"}}>{s.text}</span>
                      </label>
                    ))}
                    <div style={{display:"flex",gap:8,marginTop:6}}>
                      <input style={{...IS,flex:1,fontSize:12,padding:"7px 12px"}} value={newSub[task.id]||""} onChange={e=>setNewSub(p=>({...p,[task.id]:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addSub(task.id)} placeholder={t.addsub}/>
                      <button onClick={()=>addSub(task.id)} style={{width:36,height:36,background:"linear-gradient(135deg,#4f46e5,#7c3aed)",border:"none",borderRadius:9,color:"white",fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>+</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>
      </div>

      {doneTasks.length>0&&(
        <div style={SEC}>
          <div style={SECTL}>{t.donetasks} ({doneTasks.length})</div>
          <div style={{display:"flex",flexDirection:"column",gap:5}}>
            {doneTasks.map(task=>(
              <div key={task.id} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 12px",background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.05)",borderRadius:10,opacity:.4}}>
                <span style={{fontSize:16,color:"#4ade80"}}>✓</span>
                <span style={{flex:1,fontSize:12,color:"#64748b",textDecoration:"line-through"}}>{task.text}</span>
                <button onClick={()=>toggleDone(task.id)} style={{background:"transparent",border:"none",color:"#334155",cursor:"pointer",fontSize:14}}>↩</button>
                <button onClick={()=>delTask(task.id)} style={{background:"transparent",border:"none",color:"#1e293b",cursor:"pointer",fontSize:16}}>×</button>
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={SEC}>
        <div style={SECTL}>{t.cat}</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>{u.cats.map(c=><span key={c} style={{fontSize:11,color:"#6366f1",background:"#6366f115",padding:"3px 10px",borderRadius:99}}>{c}</span>)}</div>
        <div style={{display:"flex",gap:8}}>
          <input style={{...IS,flex:1}} value={newCat} onChange={e=>setNewCat(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addCat()} placeholder={t.newcat}/>
          <button onClick={addCat} style={{width:40,height:40,background:"linear-gradient(135deg,#4f46e5,#7c3aed)",border:"none",borderRadius:10,color:"white",fontSize:22,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
        </div>
      </div>

      <div style={SEC}>
        <div style={SECTL}>{t.proj}</div>
        {(u.projects||[]).map(p=><div key={p.id} style={{fontSize:12,color:"#475569",marginBottom:5}}>📦 {p.name} — {tasks.filter(t=>t.projectId===String(p.id)).length} Tasks</div>)}
        <div style={{display:"flex",gap:8}}>
          <input style={{...IS,flex:1}} value={newProj} onChange={e=>setNewProj(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addProj()} placeholder={t.newproj}/>
          <button onClick={addProj} style={{width:40,height:40,background:"linear-gradient(135deg,#4f46e5,#7c3aed)",border:"none",borderRadius:10,color:"white",fontSize:22,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
        </div>
      </div>

      <div style={SEC}>
        <div style={SECTL}>{t.backup}</div>
        <button onClick={doExport} style={{...SB,marginBottom:8}}>{copied?t.copied:t.exportbtn}</button>
        {expCode&&<textarea style={{width:"100%",padding:"8px 10px",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:8,color:"#64748b",fontSize:10,resize:"vertical",marginBottom:6,boxSizing:"border-box"}} readOnly value={expCode} rows={3} onClick={e=>e.target.select()}/>}
        <textarea style={{width:"100%",padding:"8px 10px",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:8,color:"#64748b",fontSize:10,resize:"vertical",marginBottom:4,boxSizing:"border-box"}} value={impCode} onChange={e=>setImpCode(e.target.value)} placeholder={t.importph} rows={3}/>
        {impErr&&<p style={{fontSize:12,color:"#ef4444",marginBottom:8}}>{impErr}</p>}
        <button onClick={doImport} style={{...SB,marginBottom:12}}>{t.importbtn}</button>
        <button onClick={()=>{if(window.confirm(t.resetconf))restart();}} style={{width:"100%",padding:"10px",background:"transparent",border:"1px solid rgba(239,68,68,0.25)",borderRadius:10,color:"#ef4444",cursor:"pointer",fontSize:12}}>↺ {t.resetbtn}</button>
      </div>

      <Nav/>
    </Page>
  );

  return null;
}

// ── STYLE CONSTANTS ──────────────────────────────────────────────────────────
const IS={width:"100%",padding:"11px 14px",background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:10,color:"#f1f5f9",fontSize:14,outline:"none",boxSizing:"border-box"};
const PB={width:"100%",padding:"13px",background:"linear-gradient(135deg,#4f46e5,#7c3aed)",border:"none",borderRadius:12,color:"white",cursor:"pointer",fontSize:14,fontWeight:700};
const SB={width:"100%",padding:"11px",background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:11,color:"#94a3b8",cursor:"pointer",fontSize:13};
const IB={background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,color:"#64748b",cursor:"pointer",fontSize:12,width:34,height:34,display:"flex",alignItems:"center",justifyContent:"center"};
const SEL={flex:1,padding:"9px 10px",background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:10,color:"#f1f5f9",fontSize:13,outline:"none"};
const SEC={padding:"14px 16px",borderBottom:"1px solid rgba(255,255,255,0.05)"};
const SECTL={fontSize:10,color:"#1e293b",letterSpacing:"0.8px",marginBottom:12,textTransform:"uppercase"};

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));

// Clear any old service workers
if("serviceWorker"in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>regs.forEach(r=>r.unregister()));
}
</script>
</body>
</html>
